name: Build and push image

# Runs only when a change lands on main. There is no manual trigger, and
# pull requests never build or push, so main is the only way to publish.
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "hooks.yaml"
      - "scripts/**"
      - ".github/workflows/build.yml"

# One release at a time, so two merges can't claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # arm64 only, built natively: the Dockerfile fetches an arm64 yq binary.
  release:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write   # push the version tag
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Patch bump from the highest vX.Y.Z tag; the first release is v0.1.0.
      - name: Next version
        id: version
        run: |
          LAST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$LAST" ]; then
            NEXT=0.1.0
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
            NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Tag release
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Report digest
        run: |
          ref="${{ env.REGISTRY }}/${IMAGE_NAME,,}:${{ steps.version.outputs.version }}@${{ steps.build.outputs.digest }}"
          echo "$ref"
          echo "Pushed \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
